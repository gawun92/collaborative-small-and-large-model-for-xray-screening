save_dir: /scratch1/jinminle/nanodet/runs/ldxray_nanodet_plus_m_416

model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998

  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages: [2, 3, 4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [116, 232, 464]
      out_channels: 96
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 12
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    aux_head:
      name: SimpleConvHead
      num_classes: 12
      input_channel: 192
      feat_channels: 192
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7

class_names: ['phone', 'orange_liquid', 'power_bank_no_cell', "laptop", 'green_liquid', 'power_bank_with_cell', 'tablet', 'blue_liquid', 'cylindrical_orange_liquid', 'non_metal_lighter', 'umbrella', 'cylindrical_green_liquid']

data:
  train:
    name: CocoDataset
    img_path: /scratch1/jinminle/nanodet/data/train/images
    ann_path: /scratch1/jinminle/nanodet/data/annotations/train.json
    input_size: [416, 416]
    keep_ratio: False
    pipeline:
      perspective: 0.0
      scale: [0.6, 1.4]
      stretch: [[0.8, 1.2], [0.8, 1.2]]
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast: [0.6, 1.4]
      saturation: [0.5, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

  val:
    name: CocoDataset
    img_path: /scratch1/jinminle/nanodet/data/test/images
    ann_path: /scratch1/jinminle/nanodet/data/annotations/test.json
    input_size: [416, 416]
    keep_ratio: False
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

  # test:
  #   name: CocoDataset
  #   img_path: /scratch1/jinminle/nanodet/data/test/images
  #   ann_path: /scratch1/jinminle/nanodet/data/annotations/test.json
  #   input_size: [416, 416]
  #   keep_ratio: False
  #   pipeline:
  #     normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

device:
  gpu_ids: [0]
  workers_per_gpu: 8
  batchsize_per_gpu: 64

schedule:
  # resume: False
  # load_model: /scratch1/jinminle/nanodet/nanodet/pretrained/nanodet-plus-m_416_checkpoint.ckpt
  val_intervals: 10
  grad_clip: 35

  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.05

  warmup:
    name: linear
    steps: 500
    ratio: 0.001

  total_epochs: 10
  lr_schedule:
    name: CosineAnnealingLR
    T_max: 50
    eta_min: 0.00005

evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP

log:
  interval: 100
